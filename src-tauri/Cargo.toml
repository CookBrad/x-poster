[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.2", features = ["protocol-asset"] }
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
# Database - using sqlx directly for better control (recommended for Tauri apps)
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "chrono"] }

# Utilities for commands
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Research + generation + X posting (OAuth 1.0a)
reqwest = { version = "0.12", features = ["json", "rustls-tls", "multipart"] }
feed-rs = "2"
hmac = "0.12"
sha1 = "0.10"
base64 = "0.22"
urlencoding = "2"
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
